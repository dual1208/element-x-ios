name: ElementX

schemes:
  ElementX:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        ElementX:
          - running
          - testing
          - profiling
          - analyzing
          - archiving
    profile:
      config: Release
    run:
      config: Debug
      environmentVariables:
        - variable: HTTPS_PROXY
          value: localhost:9090
          isEnabled: false
        - variable: HTTP_PROXY
          value: localhost:9090
          isEnabled: false
        - variable: UI_TESTS_SCREEN
          value: ""
          isEnabled: false
        - variable: RESET_APP_SETTINGS
          value: "true"
          isEnabled: false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ElementX
      testPlans:
        - path: ../../UnitTests/SupportingFiles/UnitTests.xctestplan
          defaultPlan: true

targets:
  ElementX:
    type: application
    platform: iOS

    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: colors/background-color
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
        - zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes: [
          {
            CFBundleTypeRole: Editor,
            CFBundleURLName: "Application",
            CFBundleURLSchemes: [
              $(BASE_BUNDLE_IDENTIFIER), # The app's own scheme for custom routes
              "matrix" # Matrix URI scheme for permalinks
            ]
          }
        ]
        UIApplicationSceneManifest: {
          UIApplicationSupportsMultipleScenes: true
        }
        UISupportedInterfaceOrientations: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight
        ]
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        keychainAccessGroupIdentifier: $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        classicAppGroupIdentifier: $(CLASSIC_APP_GROUP_IDENTIFIER)
        classicAppKeychainServiceIdentifier: $(CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER)
        classicAppKeychainAccessGroupIdentifier: $(CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        classicAppDeepLinkURL: $(CLASSIC_APP_DEEP_LINK_URL)
        productionAppName: $(PRODUCTION_APP_NAME)
        isNightlyBuild: $(IS_NIGHTLY_BUILD)
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [
          INSendMessageIntent,
          INStartCallIntent,
        ]
        NSCameraUsageDescription: 家庭聊天需要使用相机来拍摄并发送照片或视频。
        NSMicrophoneUsageDescription: 家庭聊天需要使用麦克风来发送语音消息和通话。
        NSPhotoLibraryAddUsageDescription: 家庭聊天需要访问照片图库来保存图片和视频。
        NSLocationWhenInUseUsageDescription: 家庭聊天需要获取位置来发送当前位置或附近地点。
        NSLocationAlwaysAndWhenInUseUsageDescription: 家庭聊天需要在后台获取位置来共享实时位置。
        NSFaceIDUsageDescription: 面容 ID 可保护你在家庭聊天中的账号。
        UIBackgroundModes: [
          audio,
          fetch,
          processing,
          voip,
          location
        ]
        BGTaskSchedulerPermittedIdentifiers: [
          io.element.elementx.background.refresh
        ]
        UTExportedTypeDeclarations:
        - UTTypeConformsTo: [public.text]
          UTTypeDescription: Mention Pills
          UTTypeIdentifier: $(PILLS_UT_TYPE_IDENTIFIER)
        CFBundleDocumentTypes:
        - CFBundleTypeName: Mention Pills
          CFBundleTypeRole: Viewer
          LSHandlerRank: Owner
          LSItemContentTypes: $(PILLS_UT_TYPE_IDENTIFIER)
        LSSupportsOpeningDocumentsInPlace: false

    entitlements:
      path: ElementX.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
        - applinks:matrix.to
        # - applinks:localhost?mode=developer # developer mode only works with https (but self-signed is fine).
        com.apple.developer.usernotifications.communication: true
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        com.apple.security.network.client: true
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_OBJC_BRIDGING_HEADER: ElementX/SupportingFiles/ElementX-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: GeneratedInterface-Swift.h
        PILLS_UT_TYPE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).pills
        DEVELOPMENT_ASSET_PATHS: Components/DevelopmentAssets/Media
        SWIFT_VERSION: 6.2
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        OTHER_SWIFT_FLAGS:
        - "-DIS_MAIN_APP"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

    preBuildScripts:
    - name: 🛠 SwiftGen
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftgen >/dev/null; then
            swiftgen config run --config Tools/SwiftGen/swiftgen-config.yml
        else
            echo "warning: SwiftGen not installed, download from https://github.com/SwiftGen/SwiftGen"
        fi
    - name: 🧙 Sourcery - Generate mocks
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/AutoMockableConfig.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    - name: 🧙 Sourcery - Generate preview tests
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/PreviewTestsConfig.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi
        
    - name: 🧙 Sourcery - Generate Accessibility Tests
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/TestablePreviewsDictionary.yml
            sourcery --config Tools/Sourcery/AccessibilityTests.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    postBuildScripts:
    - name: 🔐 Embed client authentication identity
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      inputFiles:
      - $(FAMILY_CLIENT_P12_PATH)
      outputFiles:
      - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/family-client.p12
      shell: /bin/sh
      script: |
        set -eu
        if [ "${FAMILY_CLIENT_AUTH_REQUIRED:-}" != "YES" ]; then
            echo "error: FAMILY_CLIENT_AUTH_REQUIRED must be YES for this managed build."
            exit 1
        fi
        if [ -z "${FAMILY_CLIENT_P12_PATH:-}" ] || [ ! -r "$FAMILY_CLIENT_P12_PATH" ]; then
            echo "error: The private family-client.p12 build input is missing or unreadable."
            exit 1
        fi
        if [ "$(/usr/bin/stat -f '%Lp' "$FAMILY_CLIENT_P12_PATH")" != "600" ]; then
            echo "error: The private family-client.p12 build input must have mode 600."
            exit 1
        fi
        expected_common_name="ios-${MARKETING_VERSION}-${CURRENT_PROJECT_VERSION}"
        validation_directory="$(/usr/bin/mktemp -d "${TMPDIR:-/tmp}/family-client.XXXXXX")"
        /bin/chmod 700 "$validation_directory"
        trap '/bin/rm -rf "$validation_directory"' EXIT
        leaf_certificate="$validation_directory/leaf.pem"
        ca_certificates="$validation_directory/ca.pem"
        umask 077
        identity_info="$(/usr/bin/openssl pkcs12 -in "$FAMILY_CLIENT_P12_PATH" -passin pass: -info -noout 2>&1)" || {
            echo "error: The private family-client.p12 build input is invalid."
            exit 1
        }
        case "$identity_info" in
            *"Shrouded Keybag"*|*"Key bag"*) ;;
            *) echo "error: The private family-client.p12 build input has no private key."; exit 1 ;;
        esac
        /usr/bin/openssl pkcs12 -in "$FAMILY_CLIENT_P12_PATH" -passin pass: -clcerts -nokeys -out "$leaf_certificate" >/dev/null 2>&1
        /usr/bin/openssl pkcs12 -in "$FAMILY_CLIENT_P12_PATH" -passin pass: -cacerts -nokeys -out "$ca_certificates" >/dev/null 2>&1
        subject="$(/usr/bin/openssl x509 -in "$leaf_certificate" -noout -subject -nameopt RFC2253 | /usr/bin/sed 's/^subject=[[:space:]]*//')"
        case ",$subject," in
            *",CN=$expected_common_name,"*) ;;
            *) echo "error: family-client.p12 does not match this app version and build."; exit 1 ;;
        esac
        certificate_text="$(/usr/bin/openssl x509 -in "$leaf_certificate" -noout -text)"
        case "$certificate_text" in
            *"TLS Web Client Authentication"*) ;;
            *) echo "error: family-client.p12 is missing the clientAuth extended key usage."; exit 1 ;;
        esac
        /usr/bin/openssl x509 -in "$leaf_certificate" -noout -checkend 0 >/dev/null || {
            echo "error: family-client.p12 is expired."
            exit 1
        }
        /usr/bin/openssl verify -purpose sslclient -CAfile "$ca_certificates" "$leaf_certificate" >/dev/null || {
            echo "error: family-client.p12 failed client certificate validation."
            exit 1
        }
        destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/family-client.p12"
        mkdir -p "$(dirname "$destination")"
        /usr/bin/install -m 644 "$FAMILY_CLIENT_P12_PATH" "$destination"
    - name: ⚠️ SwiftLint
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        if [ "$SKIP_OPTIONAL_STYLE_CHECKS" = "YES" ]; then
            exit 0
        fi
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftlint >/dev/null; then
            swiftlint
        else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
        fi
    - name: 🧹 SwiftFormat
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        if [ "$SKIP_OPTIONAL_STYLE_CHECKS" = "YES" ]; then
            exit 0
        fi
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftformat >/dev/null; then
            swiftformat --lint --lenient "$PROJECT_DIR"
        else
            echo "warning: SwiftFormat not installed, download from https://github.com/nicklockwood/SwiftFormat"
        fi

    dependencies:
    - target: NSE
    - target: ShareExtension
    - target: MatrixRustSDKMocks
    - package: MatrixRustSDK
      embed: true
    - package: Compound
    - package: BuildExtensions
      product: Macros
    - package: Algorithms
    - package: AsyncAlgorithms
    - package: AnalyticsEvents
    - package: Collections
    - package: DeviceKit
    - package: EmbeddedElementCall
    - package: KeychainAccess
    - package: Kingfisher
    - package: KZFileWatchers
    - package: LoremSwiftum
    - package: LRUCache
    - package: Mantis
    - target: MapLibreInterface
      embed: true
    # Embedded but not linked, dlopen'd on first map use
    - target: MapLibreShim
      link: false
      embed: true
    # The app just embeds the framework so it's in the bundle for the shim's load 
    # command to resolve against.
    - framework: ../../MapLibre.framework
      implicit: true
      link: false
      embed: true
    - package: SwiftState
    - package: GZIP
    - package: Version
    - package: Emojibase
    - package: WysiwygComposer
    - package: SwiftOGG
    - package: SwiftSoup
    - package: SwiftFlow
      product: Flow
    - package: DSWaveformImage
      product: DSWaveformImageViews

    sources:
    - path: ../Sources
      excludes:
        - Other/Extensions/XCTestCase.swift
        - Other/Extensions/XCUIElement.swift
    - path: ../../Components/Secrets/Secrets.swift
    - path: ../Resources
    - path: ../SupportingFiles
    - path: ../../Tools/Scripts/Templates/SimpleScreenExample/ElementX
    - path: ../../Components/DevelopmentAssets/Media
    
    # This is required for testing purposes... The problem with unit tests is that if you
    # try to `@testable import NSE` you can only get the definition of files, but due to a
    # limitation in how they work, they can only compile files that are part of the main test
    # target, so linking will fail. The solution is to just have the main app to reference the
    # extension code, and test it directly.
    - path: ../../NSE/Sources
